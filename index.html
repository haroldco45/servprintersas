<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SERVPRINTER SAS - Soporte Galáctico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            /* Fondo de tuerquitas y tornillos (textura técnica) */
            background-image: url('https://www.transparenttextures.com/patterns/carbon-fibre.png'), 
                              linear-gradient(rgba(255,255,255,0.8), rgba(255,255,255,0.8));
            background-color: #f4f4f4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: none;
        }
        .btn-whatsapp {
            background-color: #25D366;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .btn-whatsapp:hover {
            background-color: #128C7E;
            color: white;
        }
        .logo {
            max-width: 180px;
            margin-bottom: 20px;
        }
        .header-title {
            color: #004a99; /* Azul Kyocera aproximado */
            font-weight: 800;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <img src="printersas.PNG" alt="Logo SERVPRINTER SAS" class="logo">
            <h2 class="header-title mb-4">SOLICITUD DE SERVICIO TÉCNICO</h2>
            
            <div class="card p-4 text-start">
                <form id="serviceForm">
                    <div class="mb-3">
                        <label class="form-label">Nombre del Cliente</label>
                        <input type="text" id="nombre" class="form-control" placeholder="Ej: Juan Pérez" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Dirección</label>
                        <input type="text" id="direccion" class="form-control" placeholder="Calle, Barrio, Ciudad" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Celular</label>
                        <input type="tel" id="celular" class="form-control" placeholder="310 000 0000" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Servicio Requerido</label>
                        <select id="servicio" class="form-select" required>
                            <option value="" selected disabled>Seleccione un servicio...</option>
                            <option value="Mantenimiento y Reparación Kyocera">🛠️ Mantenimiento y Reparación Kyocera</option>
                            <option value="Suministros">📑 Suministros</option>
                            <option value="Repuestos">⚙️ Repuestos</option>
                            <option value="Alquiler de Impresoras">🖨️ Alquiler de Impresoras</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Modelo de Impresora</label>
                        <input type="text" id="modelo" class="form-control" placeholder="Ej: Kyocera Ecosys M3655" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Observaciones (Falla reportada)</label>
                        <textarea id="observacion" class="form-control" rows="3" placeholder="Cuéntanos qué le pasa a tu equipo..."></textarea>
                    </div>

                    <input type="hidden" id="gps_data" value="Ubicación no proporcionada">

                    <button type="button" onclick="enviarWhatsApp()" class="btn btn-whatsapp w-100 py-3 mt-3">
                        🚀 ENVIAR SOLICITUD POR WHATSAPP
                    </button>
                </form>
            </div>
            <p class="mt-4 text-muted small">SERVPRINTER SAS - Montería, Córdoba</p>
        </div>
    </div>
</div>

<script>
    // Función para obtener ubicación automáticamente al cargar o interactuar
    function obtenerUbicacion() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                document.getElementById('gps_data').value = `https://www.google.com/maps?q=${lat},${lon}`;
            }, function(error) {
                console.log("El usuario denegó el GPS o hubo un error.");
            });
        }
    }

    // Ejecutar captura de ubicación apenas cargue
    window.onload = obtenerUbicacion;

    function enviarWhatsApp() {
        const nombre = document.getElementById('nombre').value;
        const direccion = document.getElementById('direccion').value;
        const celular = document.getElementById('celular').value;
        const servicio = document.getElementById('servicio').value;
        const modelo = document.getElementById('modelo').value;
        const observacion = document.getElementById('observacion').value;
        const gps = document.getElementById('gps_data').value;

        if(!nombre || !direccion || !servicio || !modelo) {
            alert("Por favor rellena los campos principales para despegar.");
            return;
        }

        // Estructura del mensaje galáctico
        const mensaje = 
            `🚀 *NUEVA SOLICITUD DE SERVICIO - SERVPRINTER SAS* 🚀\n\n` +
            `👤 *Cliente:* ${nombre}\n` +
            `📍 *Dirección:* ${direccion}\n` +
            `📞 *Celular:* ${celular}\n\n` +
            `🛠️ *SERVICIO:* ${servicio}\n` +
            `🖨️ *Modelo:* ${modelo}\n` +
            `📝 *Detalles:* ${observacion}\n\n` +
            `🌍 *Ubicación GPS:* ${gps}\n\n` +
            `_Enviado desde la App Web_`;

        const telefono = "573162225985";
        const url = `https://api.whatsapp.com/send?phone=${telefono}&text=${encodeURIComponent(mensaje)}`;
        
        window.open(url, '_blank');
    }
</script>

</body>
</html>
